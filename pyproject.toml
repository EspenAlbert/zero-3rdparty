[project]
name = "zero-3rdparty"
version = "1.0.0b7"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
readme = "readme.md"
license = "MIT"
keywords = []
authors = [
  { name = "EspenAlbert", email = "espen.albert1@gmail.com" },
]

[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "zero_3rdparty/*.py",
  "zero_3rdparty/py.typed",
]
exclude = [
  "*_test.py",
  "conftest.py",
  "test_*.json",
]

[tool.pkg-ext]
tag_prefix = "v"
flat_package = true
allowed_duplicate_names = [
  "copy",
  "key_values",
  "KT",
  "VT",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-ignore = [
  "E501",   # line too long (handled by formatter)
  "UP006",  # use `type` instead of `Type` from typing module
  "UP007",  # use `X | Y` instead of `Union[X, Y]`
  "UP035",  # use `typing` instead of `typing_extensions`
  "UP040",  # use `type` keyword instead of `TypeAlias`
  "UP046",  # use type parameters instead of `Generic[T]` subclass
  "UP047",  # use type parameters on functions instead of TypeVar
]
extend-select = [
  "Q",
  "RUF100",
  "C90",
  "UP",
  "I",
  "T",
]

[tool.pytest.ini_options]
addopts = "-s -vv --log-cli-level=INFO"
python_files = [
  "*_test.py",
  "test_*.py",
]

[tool.coverage.report]
omit = [
  "*_test.py",
]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
  "pkg-ext>=0.0.1",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "pytest-freezer>=0.4.9",
  "ruff>=0.14",
  "xdoctest>=1.3.0",
]
