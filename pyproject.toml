# === OK_EDIT ===
[project]
name = "my-package"
version = "0.1.0"
description = "Package description"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# === DO_NOT_EDIT: path-sync ruff ===
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-ignore = ["E501", "UP006", "UP007", "UP035"]
extend-select = ["Q", "RUF100", "C90", "UP", "I", "T"]
# === OK_EDIT ===

# === DO_NOT_EDIT: path-sync pytest ===
[tool.pytest.ini_options]
addopts = "-s -vv --log-cli-level=INFO"
python_files = ["*_test.py", "test_*.py"]
# === OK_EDIT ===

# === DO_NOT_EDIT: path-sync coverage ===
[tool.coverage.report]
omit = ["*_test.py"]
exclude_lines = ["no cov", "if __name__ == .__main__.:"]
# === OK_EDIT ===

# === DO_NOT_EDIT: path-sync dev ===
[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]
# === OK_EDIT ===
