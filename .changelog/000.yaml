changelog_message: 'fix(sections): preserve single blank lines between sections'
message: 'fix(sections): preserve single blank lines between sections


  Change content_after type from `str = ""` to `str | None = None` to

  distinguish between "no content after" (None) and "one blank line" ("").


  Previously, a single blank line between sections was lost because

  `"\n".join([''''])` produces `""` which is falsy and was skipped during

  section reconstruction.


  Now:

  - None = no content after this section

  - "" = one blank line after this section

  - "\n" = two blank lines, etc.'
