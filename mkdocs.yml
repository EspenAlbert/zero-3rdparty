# === DO_NOT_EDIT: pkg-ext site ===
site_name: zero_3rdparty
# === OK_EDIT: pkg-ext site ===
# === DO_NOT_EDIT: pkg-ext theme ===
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
# === OK_EDIT: pkg-ext theme ===
# === DO_NOT_EDIT: pkg-ext nav ===
nav:
  - Home: index.md
  - sections:
    - Overview: sections/index.md
    - Section: sections/section.md
    - SectionPart: sections/sectionpart.md
    - replace_sections: sections/replace_sections.md
    - Examples:
      - CommentConfig: examples/sections/CommentConfig.md
      - parse_sections: examples/sections/parse_sections.md
      - replace_sections: examples/sections/replace_sections.md
      - get_comment_config: examples/sections/get_comment_config.md
# === OK_EDIT: pkg-ext nav ===
# === DO_NOT_EDIT: pkg-ext extensions ===
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - attr_list
# === OK_EDIT: pkg-ext extensions ===